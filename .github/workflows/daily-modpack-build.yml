name: Daily modpack build

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *' # 3:20am UTC every day

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  RELEASE_REPOSITORY: GTNewHorizons/GTNH-Daily-Builds
  RELEASE_RETENTION_DAYS: 14
  MAX_DAILY_RELEASES: 30

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      today: ${{ steps.date.outputs.today }}
      daily_non_daily_changelog_file: ${{ steps.release-info.outputs.daily_non_daily_changelog_file }}
      changelog_name: ${{ steps.changelog-name.outputs.changelog_name }}
    steps:
      #  check-out repo and set-up python
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: 3.11
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Get current date
        id: date
        shell: bash
        run: |
          echo "today=$(date --iso-8601)+${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "cachedate=$(date '+%G-w%V')" >> "$GITHUB_OUTPUT"

      - name: Load cached mod zips
        id: load_mod_cache
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: daxxl-daily-${{ runner.os }}-${{ steps.date.outputs.cachedate }}
          restore-keys: |
            daxxl-daily-${{ runner.os }}-

      - name: Build modpack archives
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.NIGHTLY_GITHUB_TOKEN }}
        run: |
          uv run python -m daxxl.cli.generate_daily --id "${{ github.run_number }}" --update-available
          uv run python -m daxxl.cli.assemble_daily

      - name: Save cached mod zips
        uses: actions/cache/save@v5
        if: steps.load_mod_cache.outputs.cache-hit != 'true'
        with:
          path: cache
          key: daxxl-daily-${{ runner.os }}-${{ steps.date.outputs.cachedate }}

      - name: Retrieve last non-daily release name
        id: release-info
        shell: bash
        run: |
          last_non_daily_release_name=$(jq -r '
          .releases
          | map(select(contains("experimental") | not))
          | map(select(contains("daily") | not))
          | sort_by(
              [
                (split("-")[0] | split(".") | map(tonumber)),   # major.minor.patch as numbers
                (if test("-rc|RC|beta|Beta|BETA") then 0 else 1 end), # pre-releases first
                .                                                # tie-breaker: lexical order
              ]
          ) | last
          ' ./gtnh-modpack.json)
          changelog_file="./releases/changelogs/changelog from ${last_non_daily_release_name} to daily.md"
          echo "daily_non_daily_changelog_file=${changelog_file}" >> "$GITHUB_ENV"
          echo "last_non_daily_release_name=${last_non_daily_release_name}" >> "$GITHUB_ENV"
          echo "daily_non_daily_changelog_file=${changelog_file}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog between daily and last non-daily release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.NIGHTLY_GITHUB_TOKEN }}
        run: |
          uv run python -m daxxl.cli.generate_changelog --previous-release-name "$last_non_daily_release_name" daily > "$daily_non_daily_changelog_file"

      - name: Upload manifest job summary
        shell: bash
        if: success() || failure()
        continue-on-error: true
        run: |
          echo "## GTNH Daily build ${{ steps.date.outputs.today }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "<details><summary><b>Github mods</b></summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mod | Version | Side |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ------- | ---- |" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.github_mods | keys[] as $k | ["", $k, .[$k].version, .[$k].side, ""] | join(" | ") | ltrimstr(" ")' releases/manifests/daily.json | sort >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "<details><summary><b>External mods</b></summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mod | Version | Side |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ------- | ---- |" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.external_mods | keys[] as $k | ["", $k, .[$k].version, .[$k].side, ""] | join(" | ") | ltrimstr(" ")' releases/manifests/daily.json | sort >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Relocate built zips
        shell: bash
        run: |
          mv releases/zip/GT_New_Horizons_daily_Server_Java_8.zip "GTNH-daily-${{ steps.date.outputs.today }}-server-java8.zip"
          mv releases/zip/GT_New_Horizons_daily_Server_Java_17-26.zip "GTNH-daily-${{ steps.date.outputs.today }}-server-java17-26.zip"
          mv releases/multi_poly/GT_New_Horizons_daily_Java_8.zip "GTNH-daily-${{ steps.date.outputs.today }}-mmcprism-java8.zip"
          mv releases/multi_poly/GT_New_Horizons_daily_Java_17-26.zip "GTNH-daily-${{ steps.date.outputs.today }}-mmcprism-java17-26.zip"
          mv releases/mobile/GT_New_Horizons_daily.mrpack "GTNH-daily-${{ steps.date.outputs.today }}-android-java17-26.mrpack"
      # Pulls the newest changelog filename and stores it in an env variable
      # so we can use it in the commit
      - name: Retrieve Changelog Name
        id: changelog-name
        shell: bash
        run: |
          changelog_name=$(./scripts/newest_changelog.sh './releases/changelogs/daily builds')
          echo "changelog_name=${changelog_name}" >> "$GITHUB_OUTPUT"

      # Bundle everything the test/upload jobs need into a single internal artifact
      - name: Upload build bundle for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: daily-build-bundle
          path: |
            GTNH-daily-${{ steps.date.outputs.today }}-server-java8.zip
            GTNH-daily-${{ steps.date.outputs.today }}-server-java17-26.zip
            GTNH-daily-${{ steps.date.outputs.today }}-mmcprism-java8.zip
            GTNH-daily-${{ steps.date.outputs.today }}-mmcprism-java17-26.zip
            GTNH-daily-${{ steps.date.outputs.today }}-android-java17-26.mrpack
            releases/manifests/daily.json
            releases/changelogs/
            gtnh-assets.json
          if-no-files-found: error
          retention-days: 1


  test:
    needs: build
    permissions:
      contents: write # publish release
    secrets: inherit
    uses: ./.github/workflows/modpack-test.yml
    with:
      bundle-name: daily-build-bundle
      zip-prefix: GTNH-daily-${{ needs.build.outputs.today }}
      today: ${{ needs.build.outputs.today }}
      media-label: daily
      media-tag: daily-screenshots
      media-title: "Daily test media (90-day rolling store)"


  notify-status:
    needs: [build, test, update-repository, upload]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Send Discord webhook with build status
        shell: bash
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_ID: ${{ needs.build.outputs.today }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UPDATE_REPOSITORY_RESULT: ${{ needs.update-repository.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set, skipping notification"
            exit 0
          fi
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Precedence: failure > cancelled > success
          if [ "$BUILD_RESULT" = "failure" ] || [ "$TEST_RESULT" = "failure" ] || [ "$UPDATE_REPOSITORY_RESULT" = "failure" ] || [ "$UPLOAD_RESULT" = "failure" ]; then
            title="Daily Build Failure"
            color=15548997
            artifacts_field='[]'
          elif [ "$BUILD_RESULT" = "cancelled" ] || [ "$TEST_RESULT" = "cancelled" ] || [ "$UPDATE_REPOSITORY_RESULT" = "cancelled" ] || [ "$UPLOAD_RESULT" = "cancelled" ]; then
            title="Daily Build Cancelled"
            color=9807270
            artifacts_field='[]'
          else
            title="Daily Build Success"
            color=5763719
            release_url="https://github.com/${RELEASE_REPOSITORY}/releases/tag/daily-${BUILD_ID}"
            artifacts_field=$(jq -n --arg url "$release_url" \
              '[{ name: "Release", value: ("[Download](" + $url + ")"), inline: true }]')
          fi

          payload=$(jq -n \
            --arg title "$title" \
            --argjson color "$color" \
            --arg build "${BUILD_ID:-unknown}" \
            --arg run_url "$RUN_URL" \
            --arg run_number "$RUN_NUMBER" \
            --arg ts "$timestamp" \
            --argjson extra "$artifacts_field" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: ([
                  { name: "Build", value: $build, inline: true },
                  { name: "Run", value: ("[#" + $run_number + "](" + $run_url + ")"), inline: true }
                ] + $extra),
                footer: { text: "GitHub Actions" },
                timestamp: $ts
              }]
            }')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

  update-repository:
    needs: [build, test]
    runs-on: ubuntu-24.04
    env:
      daily_non_daily_changelog_file: ${{ needs.build.outputs.daily_non_daily_changelog_file }}
      changelog_name: ${{ needs.build.outputs.changelog_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.NIGHTLY_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          ref: master

      - name: Download build bundle
        uses: actions/download-artifact@v7
        with:
          name: daily-build-bundle

      - name: Push daily changelog in commit to master
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add "$daily_non_daily_changelog_file"
          git add "./releases/changelogs/daily builds"
          git add ./releases/manifests/daily.json
          git add ./gtnh-assets.json
          git commit -m "Upload daily $changelog_name"
          git push origin master

  upload:
    needs: [build, test, update-repository]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # This job has no checkout or DreamAssemblerXXL credential. Its GitHub App
    # token is scoped only to GTNH-Daily-Builds.
    permissions: {}
    env:
      daily_non_daily_changelog_file: ${{ needs.build.outputs.daily_non_daily_changelog_file }}
    steps:
      - name: Download build bundle
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: daily-build-bundle

      # Keep legacy artifacts available while consumers migrate to releases.
      - name: Upload manifest
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: gtnh-daily-${{ needs.build.outputs.today }}-manifest.json
          path: releases/manifests/daily.json

      - name: Upload server zip
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: GTNH-daily-${{ needs.build.outputs.today }}-server-java8.zip
          archive: false

      - name: Upload modern java server zip
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: GTNH-daily-${{ needs.build.outputs.today }}-server-java17-26.zip
          archive: false

      - name: Upload Prism zip
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: GTNH-daily-${{ needs.build.outputs.today }}-mmcprism-java8.zip
          archive: false

      - name: Upload modern java Prism zip
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: GTNH-daily-${{ needs.build.outputs.today }}-mmcprism-java17-26.zip
          archive: false

      - name: Upload android built mrpack
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: GTNH-daily-${{ needs.build.outputs.today }}-android-java17-26.mrpack
          archive: false

      - name: Package manifest release asset
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        run: zip -j gtnh-daily-${{ needs.build.outputs.today }}-manifest.json.zip releases/manifests/daily.json

      - name: Create daily releases token
        if: ${{ always() }}
        id: daily-releases-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DAILY_RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DAILY_RELEASES_APP_PRIVATE_KEY }}
          owner: GTNewHorizons
          repositories: GTNH-Daily-Builds
          permission-contents: write

      # Publish the tested modpack variants in the configured download repository.
      - name: Publish daily release
        if: ${{ success() && needs.build.result == 'success' && needs.test.result == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.daily-releases-token.outputs.token }}
          TAG: daily-${{ needs.build.outputs.today }}
        run: |
          set -euo pipefail
          assets=(
            gtnh-daily-${{ needs.build.outputs.today }}-manifest.json.zip
            GTNH-daily-${{ needs.build.outputs.today }}-server-java8.zip
            GTNH-daily-${{ needs.build.outputs.today }}-server-java17-26.zip
            GTNH-daily-${{ needs.build.outputs.today }}-mmcprism-java8.zip
            GTNH-daily-${{ needs.build.outputs.today }}-mmcprism-java17-26.zip
            GTNH-daily-${{ needs.build.outputs.today }}-android-java17-26.mrpack
          )

          if gh release view "$TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --prerelease \
              --title "GTNH daily ${{ needs.build.outputs.today }}" \
              --notes-file "$daily_non_daily_changelog_file"
          fi

      - name: Delete expired daily releases
        if: ${{ always() && steps.daily-releases-token.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.daily-releases-token.outputs.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "$RELEASE_RETENTION_DAYS days ago" +%Y-%m-%d)
          echo "Deleting daily releases dated before $cutoff"

          tags=$(gh release list --repo "$RELEASE_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^daily-([0-9]{4}-[0-9]{2}-[0-9]{2})\+[0-9]+$ ]] && [[ "${BASH_REMATCH[1]}" < "$cutoff" ]]; then
              echo "Deleting expired release $tag"
              gh release delete "$tag" --repo "$RELEASE_REPOSITORY" --cleanup-tag --yes
            fi
          done <<< "$tags"

      - name: Enforce maximum daily release count
        if: ${{ always() && steps.daily-releases-token.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.daily-releases-token.outputs.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "$RELEASE_REPOSITORY" --limit 1000 --order asc --json tagName --jq '.[].tagName')
          daily_tags=()
          while IFS= read -r tag; do
            [[ "$tag" =~ ^daily-[0-9]{4}-[0-9]{2}-[0-9]{2}\+[0-9]+$ ]] && daily_tags+=("$tag")
          done <<< "$tags"

          total=${#daily_tags[@]}
          echo "Found $total daily releases (max $MAX_DAILY_RELEASES)"
          if (( total > MAX_DAILY_RELEASES )); then
            to_delete=$((total - MAX_DAILY_RELEASES))
            for tag in "${daily_tags[@]:0:to_delete}"; do
              echo "Deleting $tag to enforce the release limit"
              gh release delete "$tag" --repo "$RELEASE_REPOSITORY" --cleanup-tag --yes
            done
          fi
