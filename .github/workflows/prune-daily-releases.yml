name: Prune daily releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 3am UTC every day

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# The built-in GITHUB_TOKEN must not have access to DreamAssemblerXXL.
permissions: {}

env:
  RELEASE_REPOSITORY: GTNewHorizons/GTNH-Daily-Builds
  RELEASE_RETENTION_DAYS: 14
  MAX_DAILY_RELEASES: 30

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Create daily releases token
        id: daily-releases-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DAILY_RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DAILY_RELEASES_APP_PRIVATE_KEY }}
          owner: GTNewHorizons
          repositories: GTNH-Daily-Builds
          permission-contents: write

      - name: Delete expired daily releases
        shell: bash
        env:
          GH_TOKEN: ${{ steps.daily-releases-token.outputs.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "$RELEASE_RETENTION_DAYS days ago" +%Y-%m-%d)
          echo "Deleting daily releases dated before $cutoff"

          tags=$(gh release list --repo "$RELEASE_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^daily-([0-9]{4}-[0-9]{2}-[0-9]{2})\+[0-9]+$ ]] && [[ "${BASH_REMATCH[1]}" < "$cutoff" ]]; then
              echo "Deleting expired release $tag"
              gh release delete "$tag" --repo "$RELEASE_REPOSITORY" --cleanup-tag --yes
            fi
          done <<< "$tags"

      - name: Enforce maximum daily release count
        shell: bash
        env:
          GH_TOKEN: ${{ steps.daily-releases-token.outputs.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "$RELEASE_REPOSITORY" --limit 1000 --order asc --json tagName --jq '.[].tagName')
          daily_tags=()
          while IFS= read -r tag; do
            [[ "$tag" =~ ^daily-[0-9]{4}-[0-9]{2}-[0-9]{2}\+[0-9]+$ ]] && daily_tags+=("$tag")
          done <<< "$tags"

          total=${#daily_tags[@]}
          echo "Found $total daily releases (max $MAX_DAILY_RELEASES)"
          if (( total > MAX_DAILY_RELEASES )); then
            to_delete=$((total - MAX_DAILY_RELEASES))
            for tag in "${daily_tags[@]:0:to_delete}"; do
              echo "Deleting $tag to enforce the release limit"
              gh release delete "$tag" --repo "$RELEASE_REPOSITORY" --cleanup-tag --yes
            done
          fi
